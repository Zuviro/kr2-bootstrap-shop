<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заявка — Pumpkin</title>
  <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body id="top">

  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">Pumpkin</a>
      <button class="navbar-toggler bg-primary" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
          <li class="nav-item"><a class="nav-link" href="catalog.html">Каталог</a></li>
          <li class="nav-item"><a class="nav-link" href="product.html">Товар</a></li>
          <li class="nav-item"><a class="nav-link active" href="order.html">Заявка</a></li>
          <li class="nav-item"><a class="nav-link" href="contacts.html">Контакты</a></li>
          <li class="nav-item"><a class="nav-link" href="faq.html">FAQ</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="index.html">Главная</a></li>
        <li class="breadcrumb-item active">Заявка</li>
      </ol>
    </nav>

    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">
        <div class="card p-4">
          <h1 class="mb-4">Оформление заявки</h1>
          
          <form id="orderForm" novalidate>
            <div class="row g-3">
              <div class="col-12 col-md-6">
                <label for="name" class="form-label">Имя *</label>
                <input type="text" class="form-control" id="name" required minlength="2">
                <div class="invalid-feedback">Введите имя.</div>
              </div>
              <div class="col-12 col-md-6">
                <label for="email" class="form-label">E-mail *</label>
                <input type="email" class="form-control" id="email" required>
                <div class="invalid-feedback">Введите корректный e-mail.</div>
              </div>
              <div class="col-12 col-md-6">
                <label for="phone" class="form-label">Телефон</label>
                <div class="input-group">
                  <span class="input-group-text">+7</span>
                  <input type="tel" class="form-control" id="phone" placeholder="900 000-00-00">
                </div>
              </div>
              <div class="col-12 col-md-6">
                <label for="item" class="form-label">Товар</label>
                <select class="form-select" id="item">
                  <option value="">Выберите товар</option>
                  <option value="Listopad">Гирлянда "Листопад"</option>
                  <option value="Osen">Искусственный букет "Осень"</option>
                  <option value="Tykva">Подсвечник "Тыква"</option>
                </select>
              </div>
              <div class="col-12">
                <label for="comment" class="form-label">Комментарий</label>
                <textarea class="form-control" id="comment" rows="3"></textarea>
              </div>
              <div class="col-12">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="agree" required>
                  <label class="form-check-label" for="agree">
                    Согласен на обработку данных *
                  </label>
                  <div class="invalid-feedback">Необходимо согласие.</div>
                </div>
              </div>
              <div class="col-12 mt-4">
                <button type="submit" class="btn btn-primary px-4">Отправить</button>
                <button type="reset" class="btn btn-outline-secondary">Очистить</button>
              </div>
            </div>
          </form>

        </div>
      </div>
    </div>
  </main>

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="orderToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="toast-header">
        <strong class="me-auto">Успех</strong>
        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Закрыть"></button>
      </div>
      <div class="toast-body">
        Заявка отправлена! Мы свяжемся с вами.
      </div>
    </div>
  </div>

  <footer class="site-footer text-center">
    <div class="container">
      <p class="mb-0">Учебный проект Pumpkin · <a href="contacts.html">Контакты</a></p>
    </div>
  </footer>

  <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
